<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cube Radar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cube Radar</h1>
    <div class="chips" id="chips"></div>
  </header>
  <div id="warnings" class="warnings" hidden></div>
  <main>
    <section class="view">
      <div class="toolbar">
        <div class="seg" role="group" aria-label="View">
          <button data-mode="radar" class="on" data-i18n="web.radar">Радар</button>
          <button data-mode="map" data-i18n="web.map">Карта</button>
        </div>
        <label><span data-i18n="web.range">Дальность</span>
          <select id="range">
            <option value="50">50 m</option>
            <option value="100">100 m</option>
            <option value="200" selected>200 m</option>
            <option value="400">400 m</option>
            <option value="1000">1 km</option>
          </select>
        </label>
        <label><span data-i18n="web.basemap">Фон</span>
          <select id="basemap">
            <option value="auto" data-i18n="web.auto">Автоматически</option>
            <option value="verteron">Verteron</option>
            <option value="altgard">Altgard</option>
          </select>
        </label>
        <button id="align" class="toggle" type="button"></button>
        <button id="align-reset" class="toggle" type="button" hidden></button>
        <label id="north-label"><span data-i18n="web.north">Север</span>
          <select id="north">
            <option value="-y">−Y</option>
            <option value="+y">+Y</option>
            <option value="+x">+X</option>
            <option value="-x">−X</option>
          </select>
        </label>
        <span class="spacer"></span>
        <label><span data-i18n="web.language">Язык</span>
          <select id="lang">
            <option value="ru">Русский</option>
            <option value="en">English</option>
          </select>
        </label>
        <label><span data-i18n="web.iPlay">Я играю</span>
          <select id="faction">
            <option value="Auto" data-i18n="web.auto">Автоматически</option>
            <option value="Elyos" data-i18n="faction.elyos">Элийцы</option>
            <option value="Asmodian" data-i18n="faction.asmodian">Асмодиане</option>
          </select>
        </label>
        <button id="enemies" class="toggle on"></button>
        <button id="sound" class="toggle"></button>
        <button id="notify" class="toggle"></button>
      </div>
      <canvas id="canvas" aria-label="Radar"></canvas>
      <div class="legend">
        <span><i class="tri">▲</i> <span data-i18n="web.legendUp"></span> · <i class="tri">■</i> <span data-i18n="web.legendLevel"></span> · <i class="tri">▼</i> <span data-i18n="web.legendDown"></span></span>
        <span><i class="sw visible"></i><span data-i18n="web.legendVisible"></span></span>
        <span><i class="sw out"></i><span data-i18n="web.legendOut"></span></span>
        <span><i class="sw opening"></i><span data-i18n="web.legendOpening"></span></span>
        <span><i class="sw gone"></i><span data-i18n="web.legendGone"></span></span>
        <span><i class="sw me"></i><span data-i18n="web.legendYou"></span></span>
        <span><i class="sw enemy"></i><span data-i18n="web.legendEnemy"></span></span>
        <span><i class="sw spot"></i><span data-i18n="web.legendSpots"></span></span>
        <span><i class="sw hist"></i><span data-i18n="web.legendHist"></span></span>
        <span data-i18n="web.mapCredit"></span>
      </div>
    </section>
    <aside>
      <section class="enemy-section">
        <div class="listhead"><h2><span data-i18n="web.enemies">Противники</span> <span id="enemy-count"></span></h2></div>
        <ol id="enemy-list" class="list"></ol>
        <p id="enemy-empty" class="empty" data-i18n="web.enemyWait"></p>
        <p class="rank-note" data-i18n="web.rankNote"></p>
      </section>
      <div class="listhead">
        <h2><span data-i18n="web.cubes">Кубы</span> <span id="count"></span></h2>
        <span class="exports">Export: <a href="/api/export/sightings.csv" download="sightings.csv">CSV</a> · <a href="/api/export/sightings.json" download="sightings.json">JSON</a></span>
      </div>
      <ol id="list" class="list"></ol>
      <p id="empty" class="empty" data-i18n="web.empty"></p>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
